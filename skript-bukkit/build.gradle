plugins {
    id 'java'
}

group = 'com.github.SkriptLang'
version = rootProject.version

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly group: 'io.papermc.paper', name: 'paper-api', version: '1.21.11-R0.1-SNAPSHOT'
    implementation project(':skript-core')

    // This module will eventually host the Bukkit/Paper-specific layer.
    // For now, the legacy Bukkit plugin continues to live in the root project.
}


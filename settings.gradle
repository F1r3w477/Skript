
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Skript'

// Additional modules for porting Skript to other platforms.
// The legacy Bukkit/Paper plugin remains in the root project for now.
include 'skript-core', 'skript-bukkit', 'skript-fabric-core', 'skript-fabric'
